name: Build SymbolStudio
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && xcodebuild -showsdks | grep -i iphone
      - name: Start booting a simulator
        run: bash Scripts/selftest.sh boot
      - name: Build device app and unsigned IPA
        run: bash build.sh device
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SymbolStudio-unsigned-ipa
          path: build/SymbolStudio_*_unsigned.ipa
          if-no-files-found: error
      - name: Build for simulator
        run: bash build.sh simulator
      - name: Render self-test in simulator
        timeout-minutes: 20
        run: bash Scripts/selftest.sh
      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SymbolStudio-selftest
          path: |
            build/selftest.log
            build/SelfTest
          if-no-files-found: ignore
